<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGM · dark luxury swap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #07070a;
            background-image: radial-gradient(circle at 25% 15%, rgba(130, 80, 255, 0.08) 0%, transparent 45%),
                              radial-gradient(circle at 80% 85%, rgba(0, 200, 255, 0.05) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 1.5rem;
            color: #f0ecff;
        }

        .glass-panel {
            background: rgba(8, 8, 13, 0.82);
            backdrop-filter: blur(20px) saturate(190%);
            -webkit-backdrop-filter: blur(20px) saturate(190%);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 35px 70px -20px rgba(0, 0, 0, 0.95),
                        0 0 0 1px rgba(255, 255, 255, 0.02) inset,
                        0 0 60px rgba(140, 90, 255, 0.10);
            width: 100%;
            max-width: 580px;
            padding: 2.6rem 2.4rem;
            position: relative;
        }

        .glass-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(190, 150, 255, 0.35), rgba(255, 255, 255, 0.6), rgba(190, 150, 255, 0.35), transparent);
            border-radius: 100%;
            pointer-events: none;
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            background: linear-gradient(135deg, #ffffff 0%, #cbb8f0 85%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .subhead {
            font-size: 0.8rem;
            font-weight: 400;
            color: #9b91ae;
            letter-spacing: 1.5px;
            margin-bottom: 2.4rem;
            padding-left: 0.9rem;
            border-left: 2px solid rgba(180, 140, 255, 0.5);
            line-height: 1.6;
            text-transform: uppercase;
        }

        /* --- swap stack --- */
        .swap-stack {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            margin-bottom: 1.6rem;
        }

        /* each input card */
        .swap-card {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 32px;
            padding: 1.2rem 1.5rem 1.3rem 1.5rem;
            transition: border 0.25s, box-shadow 0.25s, background 0.2s;
        }

        .swap-card:hover {
            border-color: rgba(160, 120, 255, 0.35);
            background: rgba(10, 8, 18, 0.55);
        }

        .swap-card:focus-within {
            border-color: rgba(180, 130, 255, 0.7);
            box-shadow: 0 0 0 3px rgba(140, 90, 255, 0.12), 0 0 20px rgba(140, 90, 255, 0.08);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
        }

        .card-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8a80a0;
            font-weight: 600;
        }

        .network-badge {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 100px;
            padding: 0.15rem 0.8rem;
            color: #b8adcf;
            font-weight: 500;
        }

        .address-display {
            font-family: 'SF Mono', 'Fira Code', 'Roboto Mono', monospace;
            font-size: 0.95rem;
            font-weight: 500;
            color: #e4dcff;
            word-break: break-all;
            line-height: 1.5;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            padding: 0.45rem 0.9rem;
            color: #cbb8f0;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background: rgba(140, 100, 255, 0.18);
            border-color: rgba(160, 120, 255, 0.6);
            color: #f0ebff;
            transform: scale(1.02);
        }

        .copy-btn:active {
            transform: scale(0.97);
        }

        .copy-btn.copied {
            border-color: #7faa6b;
            background: rgba(80, 140, 80, 0.2);
            color: #d4f0d4;
        }

        .address-input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 0.3rem 0;
            font-size: 0.95rem;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #f0ecff;
            outline: none;
            letter-spacing: 0.2px;
            line-height: 1.5;
        }

        .address-input::placeholder {
            color: #5a5068;
            font-weight: 300;
            letter-spacing: 0.4px;
        }

        /* ---- swap icon between cards ---- */
        .swap-divider {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -1.1rem 0 -0.9rem 0;
            position: relative;
            z-index: 5;
            pointer-events: none;
        }

        .swap-icon {
            background: rgba(20, 14, 30, 0.95);
            border: 1.5px solid rgba(160, 120, 255, 0.45);
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: #c7b6f0;
            box-shadow: 0 0 30px rgba(140, 90, 255, 0.25), 0 0 10px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            pointer-events: auto;
            cursor: default;
            user-select: none;
        }

        .swap-icon svg {
            display: block;
            opacity: 0.9;
        }

        .swap-icon:hover {
            border-color: rgba(190, 150, 255, 0.8);
            box-shadow: 0 0 40px rgba(160, 110, 255, 0.35);
            transform: scale(1.04);
        }

        /* --- confirm button --- */
        .confirm-btn {
            width: 100%;
            padding: 1.1rem;
            border-radius: 40px;
            background: linear-gradient(135deg, #2a1f3a 0%, #0f0c16 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f0eaff;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 1.4rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
        }

        .confirm-btn:not(:disabled):hover {
            background: linear-gradient(135deg, #392b52 0%, #171224 100%);
            border-color: rgba(180, 140, 255, 0.6);
            transform: translateY(-2px);
            box-shadow: 0 18px 30px -12px rgba(100, 60, 200, 0.4);
        }

        .confirm-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(0.6);
            border-color: rgba(255, 255, 255, 0.05);
        }

        /* status */
        .status-message {
            font-size: 0.85rem;
            text-align: center;
            margin-top: 1.4rem;
            min-height: 2.5rem;
            color: #b0a7c0;
            letter-spacing: 0.3px;
            font-weight: 400;
            transition: all 0.2s;
            padding: 0.2rem;
            border-radius: 100px;
        }

        .status-success {
            color: #a0dfa0;
            background: rgba(80, 140, 80, 0.1);
            padding: 0.6rem;
        }

        .status-error {
            color: #f0a0a0;
            background: rgba(160, 60, 60, 0.1);
            padding: 0.6rem;
        }

        .status-info {
            color: #cdc2e6;
        }

        .floating-note {
            font-size: 0.65rem;
            text-align: center;
            color: #4d485c;
            margin-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 1.2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .glass-panel {
                padding: 2rem 1.4rem;
                border-radius: 32px;
            }
            h1 {
                font-size: 1.7rem;
            }
            .swap-card {
                padding: 1rem 1.2rem;
                border-radius: 24px;
            }
            .address-display {
                font-size: 0.8rem;
            }
            .copy-btn {
                padding: 0.4rem 0.8rem;
                font-size: 0.65rem;
            }
            .swap-icon {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h1>NGM · SWAP</h1>
        <div class="subhead">
            GRAM → NGM · private exchange
        </div>

        <div class="swap-stack">
            <!-- FROM: GRAM payment address -->
            <div class="swap-card">
                <div class="card-top">
                    <span class="card-label">You pay (GRAM)</span>
                    <span class="network-badge">TON</span>
                </div>
                <div class="address-display">
                    <span id="paymentAddress" style="flex:1;">UQCvbnPQ445IOtZrdSu4j2r6ugo_2dYb86ZQAkMJv2SCiOCk</span>
                    <button class="copy-btn" id="copyBtn" type="button">
                        <span>⧉</span> COPY
                    </button>
                </div>
            </div>

            <!-- swap icon -->
            <div class="swap-divider">
                <div class="swap-icon" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 16V4M7 4L3 8M7 4L11 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17 8V20M17 20L21 16M17 20L13 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>

            <!-- TO: user NGM receiving address -->
            <div class="swap-card">
                <div class="card-top">
                    <span class="card-label">You receive (NGM)</span>
                    <span class="network-badge">NGM</span>
                </div>
                <input
                    type="text"
                    id="userAddress"
                    class="address-input"
                    placeholder="Enter your NGM receiving address (UQ... / EQ...)"
                    autocomplete="off"
                    spellcheck="false"
                >
            </div>
        </div>

        <button class="confirm-btn" id="confirmBtn" type="button" disabled>
            <span>✦</span> CONFIRM SWAP <span>✦</span>
        </button>

        <div id="statusMessage" class="status-message"></div>

        <div class="floating-note">
            <span>◈ exclusive access</span>
            <span>◈ dark pool</span>
            <span>◈ private settlement</span>
        </div>
    </div>

    <script>
        (function() {
            const paymentAddressEl = document.getElementById('paymentAddress');
            const copyBtn = document.getElementById('copyBtn');
            const userAddressInput = document.getElementById('userAddress');
            const confirmBtn = document.getElementById('confirmBtn');
            const statusMessage = document.getElementById('statusMessage');

            // ---- copy payment address ----
            copyBtn.addEventListener('click', async () => {
                const address = paymentAddressEl.innerText.trim();
                try {
                    await navigator.clipboard.writeText(address);
                    copyBtn.innerHTML = '<span>✓</span> COPIED';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.innerHTML = '<span>⧉</span> COPY';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    const textArea = document.createElement('textarea');
                    textArea.value = address;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    copyBtn.innerHTML = '<span>✓</span> COPIED';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.innerHTML = '<span>⧉</span> COPY';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                }
            });

            // ---- validation ----
            function validateAddress() {
                const val = userAddressInput.value.trim();
                confirmBtn.disabled = val.length < 20;
            }

            userAddressInput.addEventListener('input', () => {
                validateAddress();
                // clear leftover status
                if (statusMessage.textContent.includes('✓') || statusMessage.textContent.includes('⛔')) {
                    statusMessage.textContent = '';
                    statusMessage.className = 'status-message';
                }
            });

            // ---- confirm swap ----
            confirmBtn.addEventListener('click', () => {
                const userAddr = userAddressInput.value.trim();

                if (!userAddr || userAddr.length < 20) {
                    statusMessage.textContent = '⛔ Please enter a valid NGM receiving address.';
                    statusMessage.className = 'status-message status-error';
                    return;
                }

                statusMessage.textContent = '⏳ Verifying swap... please wait.';
                statusMessage.className = 'status-message status-info';
                confirmBtn.disabled = true;

                setTimeout(() => {
                    statusMessage.textContent = '✓ Swap registered. NGM will be sent after confirmation.';
                    statusMessage.className = 'status-message status-success';

                    setTimeout(() => {
                        confirmBtn.disabled = false;
                        validateAddress();
                    }, 1500);

                    setTimeout(() => {
                        if (statusMessage.classList.contains('status-success')) {
                            statusMessage.textContent = '';
                            statusMessage.className = 'status-message';
                        }
                    }, 8000);

                }, 1800);
            });

            // initial check
            validateAddress();

            // enter key triggers confirm if enabled
            userAddressInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!confirmBtn.disabled) {
                        confirmBtn.click();
                    }
                }
            });
        })();
    </script>
</body>
</html>
